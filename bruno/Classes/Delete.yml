info:
  name: Delete
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{BASE_URL}}/{{ENDPOINT}}/{{id}}"
  auth: inherit

runtime:
  variables:
    - name: id
      value:
        type: number
        data: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
