info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/{{ENDPOINT}}"
  auth: inherit
  body:
    type: json
    data: |
      {
        "name": "{{name}}",
        "schoolYear": "{{schoolYear}}"
      }

runtime:
  variables:
    - name: name
      value:
        type: string
        data: I.DA-TEST
    - name: schoolYear
      value:
        type: string
        data: "2026-2027"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
