info:
  name: Create
  type: http
  seq: 1

http:
  method: POST
  url: "{{BASE_URL}}/{{ENDPOINT}}"
  auth: inherit
  body:
    type: json
    data: |
      {
        "name": "{{name}}",
        "code": "{{code}}"
      }

runtime:
  variables:
    - name: name
      value:
        type: string
        data: Atelier Test
    - name: code
      value:
        type: string
        data: TST1

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
