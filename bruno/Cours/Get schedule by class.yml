info:
  name: Get schedule by class
  type: http
  seq: 4

http:
  method: GET
  url: "{{BASE_URL}}/{{ENDPOINT}}?classe={{classe}}"
  auth: inherit

runtime:
  variables:
    - name: classe
      value:
        type: string
        data: I.DA-P3A

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
