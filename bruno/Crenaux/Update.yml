info:
  name: Update
  type: http
  seq: 4

http:
  method: PUT
  url: "{{BASE_URL}}/{{ENDPOINT}}/{{id}}"
  auth: inherit
  body:
    type: json
    data: |
      {
        "classe": {{classe}},
        "course": {{course}},
        "day": "{{day}}",
        "startHour": "{{startHour}}",
        "endHour": "{{endHour}}",
        "room": "{{room}}"
      }

runtime:
  variables:
    - name: id
      value:
        type: number
        data: "1"
    - name: classe
      value:
        type: number
        data: "1"
    - name: course
      value:
        type: number
        data: "1"
    - name: day
      value:
        type: string
        data: jeudi
    - name: startHour
      value:
        type: string
        data: "08:05"
    - name: endHour
      value:
        type: string
        data: "11:40"
    - name: room
      value:
        type: string
        data: R104

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
